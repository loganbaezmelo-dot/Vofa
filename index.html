<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vofa AI | You don't need AI for AI-generated videos!</title>
  <style>
    :root {
      --bg: #0b0d14;
      --card: #131722;
      --border: #23293d;
      --accent: #8b5cf6;
      --accent-grad: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    header {
      width: 100%;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand span {
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: #38bdf8;
    }

    .hero {
      text-align: center;
      padding: 24px 16px 12px;
      width: 100%;
    }

    .hero h1 {
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 20%, #a855f7 65%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.4;
      padding: 0 10px;
    }

    main {
      width: 100%;
      padding: 12px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel h2 {
      font-size: 1rem;
      font-weight: 700;
    }

    /* Auto-adapts to vertical or horizontal camera feeds */
    .view-box {
      width: 100%;
      min-height: 240px;
      background: #06070a;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    video, canvas {
      width: 100%;
      height: auto;
      max-height: 70vh;
      display: block;
      touch-action: none;
    }

    #renderCanvas {
      display: none;
      cursor: crosshair;
    }

    .placeholder-msg {
      position: absolute;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: 10px 12px;
      background: #1c2233;
      border: 1px solid var(--border);
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background: var(--accent-grad);
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    textarea {
      width: 100%;
      height: 80px;
      background: #090b11;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
    }

    textarea:focus {
      border-color: #a855f7;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">VOFA <span>AI</span></div>
    <div class="badge">Trace-Mask Engine</div>
  </header>

  <div class="hero">
    <h1>You don't need AI for AI-generated videos!</h1>
    <p>Turn your real face and voice into infinite automated videos.</p>
  </div>

  <main>
    <div class="panel">
      <h2>1. Face & Mouth Selection</h2>

      <div class="view-box" id="viewBox">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="renderCanvas"></canvas>
        <div class="placeholder-msg" id="camPlaceholder">Webcam feed offline</div>
      </div>

      <div class="row">
        <button id="camBtn" onclick="toggleCamera()">Open Camera</button>
        <button id="snapBtn" onclick="freezePortrait()" disabled>Snapshot Face</button>
      </div>

      <div class="row" id="drawControls" style="display: none;">
        <button onclick="clearMask()" style="color: #f87171;">Clear Drawing</button>
      </div>

      <h2 style="margin-top: 4px;">2. Script Input</h2>
      <textarea id="scriptInput">hello welcome to vofa ai rule based speech generator</textarea>

      <button class="primary" id="genBtn" onclick="executeSynthesis()" disabled>
        Generate Video
      </button>
    </div>

    <div class="panel">
      <h2>Generated Output</h2>

      <div class="view-box">
        <div class="placeholder-msg" id="outPlaceholder">No generated video yet.</div>
        <video id="outVideo" controls playsinline style="display: none; width: 100%; height: auto;"></video>
      </div>

      <p id="statusMsg" style="font-size: 0.8rem; color: var(--muted); text-align: center;">Take a snapshot to draw around your mouth</p>
      <button id="downloadBtn" disabled onclick="downloadVid()">Download Output</button>
    </div>
  </main>

  <script>
    let stream = null;
    let rawCapturedImage = null;
    let mouthPath = [];
    let isDrawing = false;
    let maskCompleted = false;

    const webcam = document.getElementById('webcam');
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const camPlaceholder = document.getElementById('camPlaceholder');
    const camBtn = document.getElementById('camBtn');
    const snapBtn = document.getElementById('snapBtn');
    const genBtn = document.getElementById('genBtn');
    const drawControls = document.getElementById('drawControls');
    const scriptInput = document.getElementById('scriptInput');
    const outVideo = document.getElementById('outVideo');
    const outPlaceholder = document.getElementById('outPlaceholder');
    const statusMsg = document.getElementById('statusMsg');
    const downloadBtn = document.getElementById('downloadBtn');

    const PHONEMES = {
      'AA': { f1: 720, f2: 1100, open: 1.0, dur: 0.16 },
      'AE': { f1: 640, f2: 1700, open: 0.85, dur: 0.15 },
      'AH': { f1: 600, f2: 1220, open: 0.7, dur: 0.14 },
      'AO': { f1: 540, f2: 850,  open: 0.75, dur: 0.16 },
      'EH': { f1: 520, f2: 1800, open: 0.6, dur: 0.14 },
      'ER': { f1: 480, f2: 1350, open: 0.45, dur: 0.15 },
      'IH': { f1: 400, f2: 1900, open: 0.4, dur: 0.13 },
      'IY': { f1: 280, f2: 2300, open: 0.3, dur: 0.15 },
      'OW': { f1: 500, f2: 900,  open: 0.65, dur: 0.16 },
      'UW': { f1: 320, f2: 850,  open: 0.35, dur: 0.16 },
      'AY': { f1: 700, f2: 1800, open: 0.9, dur: 0.18 },
      'EY': { f1: 500, f2: 2000, open: 0.6, dur: 0.16 },
      'B':  { f1: 220, f2: 700,  open: 0.05, dur: 0.07 },
      'D':  { f1: 250, f2: 1600, open: 0.1, dur: 0.07 },
      'G':  { f1: 250, f2: 1900, open: 0.1, dur: 0.07 },
      'P':  { f1: 200, f2: 700,  open: 0.05, dur: 0.07 },
      'T':  { f1: 250, f2: 1700, open: 0.1, dur: 0.07 },
      'K':  { f1: 250, f2: 2000, open: 0.1, dur: 0.08 },
      'S':  { f1: 220, f2: 3200, open: 0.15, dur: 0.10 },
      'Z':  { f1: 240, f2: 2800, open: 0.15, dur: 0.10 },
      'F':  { f1: 220, f2: 1500, open: 0.15, dur: 0.09 },
      'V':  { f1: 240, f2: 1400, open: 0.2, dur: 0.09 },
      'M':  { f1: 280, f2: 900,  open: 0.05, dur: 0.09 },
      'N':  { f1: 280, f2: 1700, open: 0.1, dur: 0.09 },
      'L':  { f1: 380, f2: 1200, open: 0.35, dur: 0.10 },
      'R':  { f1: 420, f2: 1300, open: 0.4, dur: 0.11 },
      'W':  { f1: 300, f2: 750,  open: 0.25, dur: 0.10 },
      'SIL':{ f1: 200, f2: 800,  open: 0.0, dur: 0.08 }
    };

    const WORD_MAP = {
      "hello": ["HH", "EH", "L", "OW"],
      "welcome": ["W", "EH", "L", "K", "AH", "M"],
      "to": ["T", "UW"],
      "vofa": ["V", "OW", "F", "AA"],
      "ai": ["EY", "AY"],
      "rule": ["R", "UW", "L"],
      "based": ["B", "EY", "S", "T"],
      "speech": ["S", "P", "IY", "CH"],
      "generator": ["JH", "EH", "N", "ER", "EY", "T", "ER"],
      "you": ["Y", "UW"],
      "dont": ["D", "OW", "N", "T"],
      "need": ["N", "IY", "D"],
      "for": ["F", "AO", "R"],
      "video": ["V", "IH", "D", "IY", "OW"],
      "videos": ["V", "IH", "D", "IY", "OW", "Z"],
      "pure": ["P", "Y", "UH", "R"],
      "code": ["K", "OW", "D"],
      "works": ["W", "ER", "K", "S"],
      "look": ["L", "UH", "K"],
      "this": ["DH", "IH", "S"]
    };

    function parseTextToPhonemes(text) {
      const words = text.toLowerCase().replace(/[^a-z\s]/g, '').split(/\s+/).filter(Boolean);
      const queue = [];
      words.forEach(w => {
        if (WORD_MAP[w]) {
          queue.push(...WORD_MAP[w]);
        } else {
          for (let ch of w) {
            if (ch === 'a') queue.push('AE');
            else if (ch === 'e') queue.push('EH');
            else if (ch === 'i') queue.push('IH');
            else if (ch === 'o') queue.push('OW');
            else if (ch === 'u') queue.push('AH');
            else if (PHONEMES[ch.toUpperCase()]) queue.push(ch.toUpperCase());
          }
        }
        queue.push('SIL');
      });
      return queue;
    }

    async function toggleCamera() {
      if (!stream) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" }
          });
          webcam.srcObject = stream;
          await webcam.play();
          camPlaceholder.style.display = 'none';
          camBtn.textContent = 'Close Camera';
          snapBtn.disabled = false;
        } catch (e) {
          alert("Couldn't open camera");
        }
      } else {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        webcam.srcObject = null;
        camPlaceholder.style.display = 'block';
        camBtn.textContent = 'Open Camera';
        snapBtn.disabled = true;
      }
    }

    function freezePortrait() {
      if (!webcam.videoWidth || webcam.videoWidth === 0) {
        alert("Camera warming up, wait 1 sec 😭");
        return;
      }

      // PRESERVES EXACT NATIVE ASPECT RATIO - NO SQUASHING
      const naturalW = webcam.videoWidth;
      const naturalH = webcam.videoHeight;
      canvas.width = naturalW;
      canvas.height = naturalH;
      ctx.drawImage(webcam, 0, 0, naturalW, naturalH);

      rawCapturedImage = new Image();
      rawCapturedImage.onload = () => {
        webcam.style.display = 'none';
        canvas.style.display = 'block';
        drawControls.style.display = 'flex';

        snapBtn.textContent = 'Retake Photo';
        snapBtn.onclick = () => location.reload();
        statusMsg.textContent = "✏️ Draw a loop around your mouth directly on your face!";
      };
      rawCapturedImage.src = canvas.toDataURL('image/jpeg', 0.95);

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    // ACCURATE 1:1 COORDINATES MATCHING THE DRAWN CANVAS
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      let clientX = e.clientX;
      let clientY = e.clientY;

      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }

      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function onStart(e) {
      if (!rawCapturedImage) return;
      e.preventDefault();
      isDrawing = true;
      mouthPath = [getCanvasCoords(e)];
      drawUserPath();
    }

    function onMove(e) {
      if (!isDrawing) return;
      e.preventDefault();
      mouthPath.push(getCanvasCoords(e));
      drawUserPath();
    }

    function onEnd(e) {
      if (!isDrawing) return;
      isDrawing = false;
      if (mouthPath.length > 5) {
        maskCompleted = true;
        genBtn.disabled = false;
        statusMsg.textContent = "Mouth area locked! Ready to generate.";
        drawUserPath(true);
      }
    }

    canvas.addEventListener('touchstart', onStart, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onEnd, { passive: false });

    canvas.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);

    function drawUserPath(isDone = false) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(rawCapturedImage, 0, 0, canvas.width, canvas.height);

      if (mouthPath.length < 2) return;

      ctx.beginPath();
      ctx.moveTo(mouthPath[0].x, mouthPath[0].y);
      for (let i = 1; i < mouthPath.length; i++) {
        ctx.lineTo(mouthPath[i].x, mouthPath[i].y);
      }
      if (isDone) ctx.closePath();

      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = Math.max(3, canvas.width * 0.008);
      ctx.stroke();

      if (isDone) {
        ctx.fillStyle = 'rgba(236, 72, 153, 0.25)';
        ctx.fill();
      }
    }

    function clearMask() {
      mouthPath = [];
      maskCompleted = false;
      genBtn.disabled = true;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(rawCapturedImage, 0, 0, canvas.width, canvas.height);
      statusMsg.textContent = "Draw a loop around your mouth!";
    }

    async function executeSynthesis() {
      const text = scriptInput.value.trim();
      if (!text || !rawCapturedImage || !maskCompleted) return;

      genBtn.disabled = true;
      statusMsg.textContent = "Synthesizing custom drawn mouth pixels...";
      outPlaceholder.style.display = "block";
      outPlaceholder.textContent = "Synthesizing...";
      outVideo.style.display = "none";

      // Clear preview stroke before recording
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(rawCapturedImage, 0, 0, canvas.width, canvas.height);

      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      const audioDest = audioCtx.createMediaStreamDestination();
      const canvasStream = canvas.captureStream(30);

      const mergedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioDest.stream.getAudioTracks()
      ]);

      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
        ? 'video/webm;codecs=vp8,opus'
        : 'video/webm';

      const recorder = new MediaRecorder(mergedStream, { mimeType });
      const chunks = [];

      recorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        audioCtx.close();
        const blob = new Blob(chunks, { type: 'video/webm' });
        outVideo.src = URL.createObjectURL(blob);
        outPlaceholder.style.display = "none";
        outVideo.style.display = "block";
        statusMsg.textContent = "Video generated with isolated mouth pixels!";
        genBtn.disabled = false;
        downloadBtn.disabled = false;
        outVideo.play();
      };

      recorder.start();

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      mouthPath.forEach(pt => {
        if (pt.x < minX) minX = pt.x;
        if (pt.x > maxX) maxX = pt.x;
        if (pt.y < minY) minY = pt.y;
        if (pt.y > maxY) maxY = pt.y;
      });
      const mouthCenterY = (minY + maxY) / 2;
      const mouthHeight = maxY - minY;

      const phonemes = parseTextToPhonemes(text);
      let targetMouthShift = 0;
      let currentMouthShift = 0;
      let isRecording = true;

      function playPhoneme(index) {
        if (index >= phonemes.length) {
          targetMouthShift = 0;
          setTimeout(() => {
            isRecording = false;
            recorder.stop();
          }, 350);
          return;
        }

        const ph = phonemes[index];
        const pData = PHONEMES[ph] || PHONEMES['AH'];
        const dur = pData.dur;

        if (ph !== 'SIL') {
          const osc = audioCtx.createOscillator();
          osc.type = 'sawtooth';

          const pitch = 145 + Math.sin(index * 0.7) * 15;
          osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(pitch * 0.92, audioCtx.currentTime + dur);

          const f1 = audioCtx.createBiquadFilter();
          f1.type = 'bandpass';
          f1.frequency.setValueAtTime(pData.f1, audioCtx.currentTime);
          f1.Q.setValueAtTime(4.5, audioCtx.currentTime);

          const f2 = audioCtx.createBiquadFilter();
          f2.type = 'bandpass';
          f2.frequency.setValueAtTime(pData.f2, audioCtx.currentTime);
          f2.Q.setValueAtTime(5.5, audioCtx.currentTime);

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.28, audioCtx.currentTime + 0.02);
          gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + dur);

          osc.connect(f1);
          osc.connect(f2);
          f1.connect(gain);
          f2.connect(gain);

          gain.connect(audioDest);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + dur);

          // Proportional mouth drop matching the drawn mouth scale
          targetMouthShift = Math.round(pData.open * (mouthHeight * 0.45));
        } else {
          targetMouthShift = 0;
        }

        setTimeout(() => {
          playPhoneme(index + 1);
        }, dur * 1000);
      }

      playPhoneme(0);

      function renderLoop() {
        if (!isRecording && currentMouthShift < 0.2) return;

        currentMouthShift += (targetMouthShift - currentMouthShift) * 0.35;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Static base face
        ctx.drawImage(rawCapturedImage, 0, 0, canvas.width, canvas.height);

        // 2. Inner cavity inside your drawn loop
        if (currentMouthShift > 1) {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(mouthPath[0].x, mouthPath[0].y);
          for (let i = 1; i < mouthPath.length; i++) {
            ctx.lineTo(mouthPath[i].x, mouthPath[i].y);
          }
          ctx.closePath();
          ctx.clip();

          ctx.fillStyle = '#220407';
          ctx.fill();

          ctx.fillStyle = '#f1f5f9';
          ctx.fillRect(minX + (maxX - minX) * 0.15, mouthCenterY - 2, (maxX - minX) * 0.7, Math.min(3, currentMouthShift));
          ctx.restore();
        }

        // 3. Translate only lower half of drawn area
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, mouthCenterY, canvas.width, canvas.height - mouthCenterY);
        ctx.clip();

        ctx.beginPath();
        ctx.moveTo(mouthPath[0].x, mouthPath[0].y);
        for (let i = 1; i < mouthPath.length; i++) {
          ctx.lineTo(mouthPath[i].x, mouthPath[i].y);
        }
        ctx.closePath();
        ctx.clip();

        ctx.drawImage(
          rawCapturedImage,
          0, 0, canvas.width, canvas.height,
          0, currentMouthShift, canvas.width, canvas.height
        );
        ctx.restore();

        requestAnimationFrame(renderLoop);
      }

      renderLoop();
    }

    function downloadVid() {
      const a = document.createElement('a');
      a.href = outVideo.src;
      a.download = 'vofa-render.webm';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
