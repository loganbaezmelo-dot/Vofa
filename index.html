<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vofa AI | You don't need AI for AI-generated videos!</title>
  <style>
    :root {
      --bg: #0b0d14;
      --card: #131722;
      --border: #23293d;
      --accent: #8b5cf6;
      --accent-grad: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    /* header */
    header {
      width: 100%;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand span {
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: #38bdf8;
    }

    /* hero with gradient text */
    .hero {
      text-align: center;
      padding: 28px 16px 16px;
      width: 100%;
    }

    .hero h1 {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 20%, #a855f7 65%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(168, 85, 247, 0.25));
    }

    .hero p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.4;
      padding: 0 10px;
    }

    /* main stack */
    main {
      width: 100%;
      padding: 12px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel h2 {
      font-size: 1rem;
      font-weight: 700;
    }

    /* media container */
    .view-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #06070a;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #renderCanvas {
      display: none;
    }

    .placeholder-msg {
      position: absolute;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: 10px 12px;
      background: #1c2233;
      border: 1px solid var(--border);
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background: var(--accent-grad);
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    textarea {
      width: 100%;
      height: 80px;
      background: #090b11;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
    }

    textarea:focus {
      border-color: #a855f7;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">VOFA <span>AI</span></div>
    <div class="badge">Deterministic Vision AI</div>
  </header>

  <div class="hero">
    <h1>You don't need AI for AI-generated videos!</h1>
    <p>Turn your real face and voice into infinite automated videos.</p>
  </div>

  <main>
    <!-- Biometrics Card -->
    <div class="panel">
      <h2>Face & Voice Source</h2>

      <div class="view-box">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="renderCanvas" width="400" height="400"></canvas>
        <div class="placeholder-msg" id="camPlaceholder">Webcam feed offline</div>
      </div>

      <div class="row">
        <button id="camBtn" onclick="toggleCamera()">Open Camera</button>
        <button id="snapBtn" onclick="applyRuleEngine()" disabled>Scan Face Boundary</button>
      </div>

      <h2 style="margin-top: 4px;">Script Input</h2>
      <textarea id="scriptInput">Look at that! Clean rule-based video generation running straight in the browser.</textarea>

      <button class="primary" id="genBtn" onclick="executeSynthesis()" disabled>
        Generate Video
      </button>
    </div>

    <!-- Output Card -->
    <div class="panel">
      <h2>Generated Output</h2>

      <div class="view-box">
        <div class="placeholder-msg" id="outPlaceholder">No generated video yet.</div>
        <video id="outVideo" controls playsinline style="display: none;"></video>
      </div>

      <p id="statusMsg" style="font-size: 0.8rem; color: var(--muted); text-align: center;">Awaiting biometric snapshot...</p>
      <button id="downloadBtn" disabled onclick="downloadVid()">Download Output</button>
    </div>
  </main>

  <script>
    let stream = null;
    let capturedImage = null;
    let detectedMouthY = 250;

    const webcam = document.getElementById('webcam');
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const camPlaceholder = document.getElementById('camPlaceholder');
    const camBtn = document.getElementById('camBtn');
    const snapBtn = document.getElementById('snapBtn');
    const genBtn = document.getElementById('genBtn');
    const scriptInput = document.getElementById('scriptInput');
    const outVideo = document.getElementById('outVideo');
    const outPlaceholder = document.getElementById('outPlaceholder');
    const statusMsg = document.getElementById('statusMsg');
    const downloadBtn = document.getElementById('downloadBtn');

    async function toggleCamera() {
      if (!stream) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" }
          });
          webcam.srcObject = stream;
          camPlaceholder.style.display = 'none';
          camBtn.textContent = 'Close Camera';
          snapBtn.disabled = false;
        } catch (e) {
          alert("Couldn't open camera");
        }
      } else {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        webcam.srcObject = null;
        camPlaceholder.style.display = 'block';
        camBtn.textContent = 'Open Camera';
        snapBtn.disabled = true;
      }
    }

    function applyRuleEngine() {
      canvas.width = 400;
      canvas.height = 400;
      ctx.drawImage(webcam, 0, 0, 400, 400);

      const imgData = ctx.getImageData(0, 0, 400, 400);
      const data = imgData.data;
      let minBrightness = 255;
      let targetY = 250;

      for (let y = 210; y < 310; y++) {
        let rowBrightness = 0;
        for (let x = 160; x < 240; x++) {
          const idx = (y * 400 + x) * 4;
          const r = data[idx], g = data[idx + 1], b = data[idx + 2];
          rowBrightness += (r * 0.299 + g * 0.587 + b * 0.114);
        }
        rowBrightness /= 80;

        if (rowBrightness < minBrightness) {
          minBrightness = rowBrightness;
          targetY = y;
        }
      }

      detectedMouthY = targetY;
      capturedImage = new Image();
      capturedImage.src = canvas.toDataURL('image/png');

      stream.getTracks().forEach(t => t.stop());
      stream = null;
      webcam.style.display = 'none';
      canvas.style.display = 'block';

      snapBtn.textContent = `Seam Found: y=${detectedMouthY} ✓`;
      snapBtn.style.color = '#10b981';
      snapBtn.style.borderColor = '#10b981';
      genBtn.disabled = false;
      statusMsg.textContent = `Rule applied: Lip boundary locked at y=${detectedMouthY}px`;
    }

    function executeSynthesis() {
      const text = scriptInput.value.trim();
      if (!text || !capturedImage) return;

      genBtn.disabled = true;
      statusMsg.textContent = "Synthesizing frames & audio...";
      outPlaceholder.style.display = "block";
      outPlaceholder.textContent = "Rendering...";
      outVideo.style.display = "none";

      const utterance = new SpeechSynthesisUtterance(text);
      const canvasStream = canvas.captureStream(30);
      const recorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        outVideo.src = URL.createObjectURL(blob);
        outPlaceholder.style.display = "none";
        outVideo.style.display = "block";
        statusMsg.textContent = "Render complete via client rule engine!";
        genBtn.disabled = false;
        downloadBtn.disabled = false;
        outVideo.play();
      };

      recorder.start();
      window.speechSynthesis.speak(utterance);

      let frame = 0;
      let animating = true;

      utterance.onend = () => {
        animating = false;
        setTimeout(() => recorder.stop(), 400);
      };

      function renderLoop() {
        if (!animating) return;

        ctx.clearRect(0, 0, 400, 400);
        ctx.drawImage(capturedImage, 0, 0, 400, detectedMouthY, 0, 0, 400, detectedMouthY);

        const mouthShift = Math.sin(frame * 0.45) > 0 ? Math.sin(frame * 0.45) * 12 : 0;

        ctx.drawImage(
          capturedImage, 
          0, detectedMouthY, 400, 400 - detectedMouthY, 
          0, detectedMouthY + mouthShift, 400, 400 - detectedMouthY
        );

        frame++;
        requestAnimationFrame(renderLoop);
      }

      renderLoop();
    }

    function downloadVid() {
      window.open(outVideo.src, '_blank');
    }
  </script>
</body>
</html>
