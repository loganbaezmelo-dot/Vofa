<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vofa AI | You don't need AI for AI-generated videos!</title>
  <style>
    :root {
      --bg: #0b0d14;
      --card: #131722;
      --border: #23293d;
      --accent: #8b5cf6;
      --accent-grad: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    header {
      width: 100%;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand span {
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: #38bdf8;
    }

    .hero {
      text-align: center;
      padding: 24px 16px 12px;
      width: 100%;
    }

    .hero h1 {
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 20%, #a855f7 65%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.4;
      padding: 0 10px;
    }

    main {
      width: 100%;
      padding: 12px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel h2 {
      font-size: 1rem;
      font-weight: 700;
    }

    .view-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #06070a;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }

    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #renderCanvas {
      display: none;
      cursor: crosshair;
    }

    .placeholder-msg {
      position: absolute;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .slider-box {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: #0a0c14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
    }

    .slider-box label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      accent-color: #ec4899;
      cursor: pointer;
    }

    button {
      flex: 1;
      padding: 10px 12px;
      background: #1c2233;
      border: 1px solid var(--border);
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background: var(--accent-grad);
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    textarea {
      width: 100%;
      height: 80px;
      background: #090b11;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
    }

    textarea:focus {
      border-color: #a855f7;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">VOFA <span>AI</span></div>
    <div class="badge">Deterministic Vision AI</div>
  </header>

  <div class="hero">
    <h1>You don't need AI for AI-generated videos!</h1>
    <p>Turn your real face and voice into infinite automated videos.</p>
  </div>

  <main>
    <div class="panel">
      <h2>Face & Lip Alignment</h2>

      <div class="view-box" id="viewBox">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="renderCanvas"></canvas>
        <div class="placeholder-msg" id="camPlaceholder">Webcam feed offline</div>
      </div>

      <div class="row">
        <button id="camBtn" onclick="toggleCamera()">Open Camera</button>
        <button id="snapBtn" onclick="freezePortrait()" disabled>Snapshot Face</button>
      </div>

      <div class="slider-box" id="sliderBox">
        <label>
          <span>Drag red line to your actual mouth line:</span>
          <b id="seamLabel" style="color: #ec4899;">y=112px</b>
        </label>
        <input type="range" id="mouthSlider" min="20" max="210" value="112" oninput="updateSeam(this.value)">
      </div>

      <h2 style="margin-top: 4px;">Script Input</h2>
      <textarea id="scriptInput">Look at that! Clean rule-based video generation running straight in the browser.</textarea>

      <button class="primary" id="genBtn" onclick="executeSynthesis()" disabled>
        Generate Video
      </button>
    </div>

    <div class="panel">
      <h2>Generated Output</h2>

      <div class="view-box">
        <div class="placeholder-msg" id="outPlaceholder">No generated video yet.</div>
        <video id="outVideo" controls playsinline style="display: none;"></video>
      </div>

      <p id="statusMsg" style="font-size: 0.8rem; color: var(--muted); text-align: center;">Take a snapshot to align your mouth</p>
      <button id="downloadBtn" disabled onclick="downloadVid()">Download Output</button>
    </div>
  </main>

  <script>
    let stream = null;
    let rawCapturedImage = null;
    let detectedMouthY = 112;

    const webcam = document.getElementById('webcam');
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const camPlaceholder = document.getElementById('camPlaceholder');
    const camBtn = document.getElementById('camBtn');
    const snapBtn = document.getElementById('snapBtn');
    const genBtn = document.getElementById('genBtn');
    const sliderBox = document.getElementById('sliderBox');
    const mouthSlider = document.getElementById('mouthSlider');
    const seamLabel = document.getElementById('seamLabel');
    const scriptInput = document.getElementById('scriptInput');
    const outVideo = document.getElementById('outVideo');
    const outPlaceholder = document.getElementById('outPlaceholder');
    const statusMsg = document.getElementById('statusMsg');
    const downloadBtn = document.getElementById('downloadBtn');

    async function toggleCamera() {
      if (!stream) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
          });
          webcam.srcObject = stream;
          await webcam.play();
          camPlaceholder.style.display = 'none';
          camBtn.textContent = 'Close Camera';
          snapBtn.disabled = false;
        } catch (e) {
          alert("Couldn't open camera");
        }
      } else {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        webcam.srcObject = null;
        camPlaceholder.style.display = 'block';
        camBtn.textContent = 'Open Camera';
        snapBtn.disabled = true;
      }
    }

    function freezePortrait() {
      if (!webcam.videoWidth || webcam.videoWidth === 0) {
        alert("Camera is still warming up, try in 1 sec 😭");
        return;
      }

      // Lock canvas dimensions to webcam ratio
      canvas.width = 400;
      canvas.height = Math.round((webcam.videoHeight / webcam.videoWidth) * 400);

      // Draw the live webcam frame to canvas
      ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);

      rawCapturedImage = new Image();
      rawCapturedImage.onload = () => {
        webcam.style.display = 'none';
        canvas.style.display = 'block';
        sliderBox.style.display = 'flex';

        mouthSlider.max = canvas.height - 10;
        detectedMouthY = Math.round(canvas.height * 0.55);
        mouthSlider.value = detectedMouthY;
        
        redrawPreviewGuide();

        snapBtn.textContent = 'Retake Photo';
        snapBtn.onclick = () => location.reload();
        genBtn.disabled = false;
        statusMsg.textContent = "Adjust slider right over your lips!";
      };
      rawCapturedImage.src = canvas.toDataURL('image/jpeg', 0.95);

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    function updateSeam(val) {
      detectedMouthY = parseInt(val, 10);
      seamLabel.textContent = `y=${detectedMouthY}px`;
      redrawPreviewGuide();
    }

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickY = e.clientY - rect.top;
      const scaleY = canvas.height / rect.height;
      const targetY = Math.round(clickY * scaleY);

      if (targetY > 10 && targetY < canvas.height - 10) {
        mouthSlider.value = targetY;
        updateSeam(targetY);
      }
    });

    function redrawPreviewGuide() {
      if (!rawCapturedImage) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(rawCapturedImage, 0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(0, detectedMouthY);
      ctx.lineTo(canvas.width, detectedMouthY);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function executeSynthesis() {
      const text = scriptInput.value.trim();
      if (!text || !rawCapturedImage) return;

      genBtn.disabled = true;
      statusMsg.textContent = "Synthesizing frames & audio...";
      outPlaceholder.style.display = "block";
      outPlaceholder.textContent = "Rendering...";
      outVideo.style.display = "none";

      const utterance = new SpeechSynthesisUtterance(text);
      const canvasStream = canvas.captureStream(30);
      const recorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        outVideo.src = URL.createObjectURL(blob);
        outPlaceholder.style.display = "none";
        outVideo.style.display = "block";
        statusMsg.textContent = "Render complete! Mouth synced to speech.";
        genBtn.disabled = false;
        downloadBtn.disabled = false;
        outVideo.play();
      };

      recorder.start();
      window.speechSynthesis.speak(utterance);

      let frame = 0;
      let animating = true;

      utterance.onend = () => {
        animating = false;
        setTimeout(() => recorder.stop(), 300);
      };

      function renderLoop() {
        if (!animating) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // Fixed upper skull
        ctx.drawImage(rawCapturedImage, 0, 0, canvas.width, detectedMouthY, 0, 0, canvas.width, detectedMouthY);

        // Jaw displacement
        const mouthShift = Math.sin(frame * 0.45) > 0 ? Math.sin(frame * 0.45) * 12 : 0;

        // Moving lower jaw
        ctx.drawImage(
          rawCapturedImage, 
          0, detectedMouthY, canvas.width, canvas.height - detectedMouthY, 
          0, detectedMouthY + mouthShift, canvas.width, canvas.height - detectedMouthY
        );

        frame++;
        requestAnimationFrame(renderLoop);
      }

      renderLoop();
    }

    function downloadVid() {
      window.open(outVideo.src, '_blank');
    }
  </script>
</body>
</html>
