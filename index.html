<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vofa AI | You don't need AI for AI-generated videos!</title>
  <style>
    :root {
      --bg: #0b0d14;
      --card: #131722;
      --border: #23293d;
      --accent: #8b5cf6;
      --accent-grad: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    header {
      width: 100%;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand span {
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: #38bdf8;
    }

    .hero {
      text-align: center;
      padding: 24px 16px 12px;
      width: 100%;
    }

    .hero h1 {
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 20%, #a855f7 65%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.4;
      padding: 0 10px;
    }

    main {
      width: 100%;
      padding: 12px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel h2 {
      font-size: 1rem;
      font-weight: 700;
    }

    .view-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #06070a;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }

    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #renderCanvas {
      display: none;
      cursor: crosshair;
    }

    .placeholder-msg {
      position: absolute;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .slider-box {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: #0a0c14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
    }

    .slider-box label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      accent-color: #ec4899;
      cursor: pointer;
    }

    button {
      flex: 1;
      padding: 10px 12px;
      background: #1c2233;
      border: 1px solid var(--border);
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    button.primary {
      background: var(--accent-grad);
      border: none;
      padding: 12px;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    textarea {
      width: 100%;
      height: 80px;
      background: #090b11;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
    }

    textarea:focus {
      border-color: #a855f7;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">VOFA <span>AI</span></div>
    <div class="badge">Rule-Based Phoneme Synthesizer</div>
  </header>

  <div class="hero">
    <h1>You don't need AI for AI-generated videos!</h1>
    <p>Turn your real face and voice into infinite automated videos.</p>
  </div>

  <main>
    <div class="panel">
      <h2>Face & Lip Alignment</h2>

      <div class="view-box" id="viewBox">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="renderCanvas"></canvas>
        <div class="placeholder-msg" id="camPlaceholder">Webcam feed offline</div>
      </div>

      <div class="row">
        <button id="camBtn" onclick="toggleCamera()">Open Camera</button>
        <button id="snapBtn" onclick="freezePortrait()" disabled>Snapshot Face</button>
      </div>

      <div class="slider-box" id="sliderBox">
        <label>
          <span>Drag line directly to your mouth seam:</span>
          <b id="seamLabel" style="color: #ec4899;">y=112px</b>
        </label>
        <input type="range" id="mouthSlider" min="20" max="210" value="112" oninput="updateSeam(this.value)">
      </div>

      <h2 style="margin-top: 4px;">Script Input</h2>
      <textarea id="scriptInput">hello welcome to vofa ai rule based speech generator</textarea>

      <button class="primary" id="genBtn" onclick="executeSynthesis()" disabled>
        Generate Video
      </button>
    </div>

    <div class="panel">
      <h2>Generated Output</h2>

      <div class="view-box">
        <div class="placeholder-msg" id="outPlaceholder">No generated video yet.</div>
        <video id="outVideo" controls playsinline style="display: none;"></video>
      </div>

      <p id="statusMsg" style="font-size: 0.8rem; color: var(--muted); text-align: center;">Take a snapshot to align your mouth</p>
      <button id="downloadBtn" disabled onclick="downloadVid()">Download Output</button>
    </div>
  </main>

  <script>
    let stream = null;
    let rawCapturedImage = null;
    let detectedMouthY = 112;

    const webcam = document.getElementById('webcam');
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const camPlaceholder = document.getElementById('camPlaceholder');
    const camBtn = document.getElementById('camBtn');
    const snapBtn = document.getElementById('snapBtn');
    const genBtn = document.getElementById('genBtn');
    const sliderBox = document.getElementById('sliderBox');
    const mouthSlider = document.getElementById('mouthSlider');
    const seamLabel = document.getElementById('seamLabel');
    const scriptInput = document.getElementById('scriptInput');
    const outVideo = document.getElementById('outVideo');
    const outPlaceholder = document.getElementById('outPlaceholder');
    const statusMsg = document.getElementById('statusMsg');
    const downloadBtn = document.getElementById('downloadBtn');

    // RULE-BASED ENGLISH PHONEME & FORMANT DICTIONARY
    // Each phoneme defines [F1 (Hz), F2 (Hz), OpenRatio (0-1), NoiseRatio (0-1)]
    const PHONEME_DATA = {
      'AA': { f1: 730,  f2: 1090, open: 1.0, noise: 0.0 }, // "odd"
      'AE': { f1: 660,  f2: 1720, open: 0.8, noise: 0.0 }, // "at"
      'AH': { f1: 640,  f2: 1190, open: 0.7, noise: 0.0 }, // "hut"
      'AO': { f1: 570,  f2: 840,  open: 0.7, noise: 0.0 }, // "ought"
      'EH': { f1: 530,  f2: 1840, open: 0.6, noise: 0.0 }, // "ed"
      'ER': { f1: 490,  f2: 1350, open: 0.4, noise: 0.0 }, // "hurt"
      'IH': { f1: 390,  f2: 1990, open: 0.4, noise: 0.0 }, // "it"
      'IY': { f1: 270,  f2: 2290, open: 0.3, noise: 0.0 }, // "eat"
      'UH': { f1: 440,  f2: 1020, open: 0.4, noise: 0.0 }, // "hood"
      'UW': { f1: 300,  f2: 870,  open: 0.3, noise: 0.0 }, // "two"
      'B':  { f1: 200,  f2: 700,  open: 0.0, noise: 0.05 },
      'D':  { f1: 250,  f2: 1600, open: 0.1, noise: 0.1 },
      'G':  { f1: 250,  f2: 2000, open: 0.1, noise: 0.1 },
      'P':  { f1: 200,  f2: 700,  open: 0.0, noise: 0.3 },
      'T':  { f1: 250,  f2: 1800, open: 0.1, noise: 0.4 },
      'K':  { f1: 250,  f2: 2100, open: 0.1, noise: 0.3 },
      'S':  { f1: 200,  f2: 3000, open: 0.2, noise: 0.8 },
      'Z':  { f1: 250,  f2: 2800, open: 0.2, noise: 0.4 },
      'F':  { f1: 200,  f2: 1500, open: 0.1, noise: 0.6 },
      'V':  { f1: 250,  f2: 1400, open: 0.2, noise: 0.3 },
      'M':  { f1: 280,  f2: 900,  open: 0.0, noise: 0.0 },
      'N':  { f1: 280,  f2: 1700, open: 0.1, noise: 0.0 },
      'L':  { f1: 380,  f2: 1200, open: 0.3, noise: 0.0 },
      'R':  { f1: 420,  f2: 1300, open: 0.4, noise: 0.0 },
      'W':  { f1: 300,  f2: 700,  open: 0.2, noise: 0.0 },
      'Y':  { f1: 280,  f2: 2200, open: 0.2, noise: 0.0 },
      'SIL':{ f1: 200,  f2: 800,  open: 0.0, noise: 0.0 }
    };

    // Rule dictionary mapping words directly to phoneme sequences
    const WORD_PRONUNCIATION_DICT = {
      "hello": ["HH", "EH", "L", "OW"],
      "welcome": ["W", "EH", "L", "K", "AH", "M"],
      "to": ["T", "UW"],
      "vofa": ["V", "OW", "F", "AA"],
      "ai": ["EY", "AY"],
      "you": ["Y", "UW"],
      "dont": ["D", "OW", "N", "T"],
      "need": ["N", "IY", "D"],
      "for": ["F", "AO", "R"],
      "generated": ["JH", "EH", "N", "ER", "EY", "T", "IH", "D"],
      "videos": ["V", "IH", "D", "IY", "OW", "Z"],
      "video": ["V", "IH", "D", "IY", "OW"],
      "rule": ["R", "UW", "L"],
      "based": ["B", "EY", "S", "T"],
      "look": ["L", "UH", "K"],
      "at": ["AE", "T"],
      "that": ["DH", "AE", "T"],
      "this": ["DH", "IH", "S"],
      "is": ["IH", "Z"],
      "a": ["EY"],
      "the": ["DH", "AH"],
      "clean": ["K", "L", "IY", "N"],
      "running": ["R", "AH", "N", "IH", "NG"],
      "straight": ["S", "T", "R", "EY", "T"],
      "in": ["IH", "N"],
      "browser": ["B", "R", "AW", "Z", "ER"],
      "speech": ["S", "P", "IY", "CH"],
      "generator": ["JH", "EH", "N", "ER", "EY", "T", "ER"],
      "my": ["M", "AY"],
      "face": ["F", "EY", "S"],
      "and": ["AE", "N", "D"],
      "voice": ["V", "OY", "S"],
      "it": ["IH", "T"],
      "works": ["W", "ER", "K", "S"],
      "pure": ["P", "Y", "UH", "R"],
      "code": ["K", "OW", "D"]
    };

    // Deterministic fallback rule when a word is not in the dictionary
    function wordToPhonemes(word) {
      const clean = word.toLowerCase().replace(/[^a-z]/g, '');
      if (WORD_PRONUNCIATION_DICT[clean]) {
        return WORD_PRONUNCIATION_DICT[clean];
      }
      // Heuristic letter-to-sound rule
      const list = [];
      for (let ch of clean) {
        if ('aeiou'.includes(ch)) {
          if (ch === 'a') list.push('AE');
          else if (ch === 'e') list.push('EH');
          else if (ch === 'i') list.push('IH');
          else if (ch === 'o') list.push('AA');
          else if (ch === 'u') list.push('AH');
        } else {
          list.push(ch.toUpperCase());
        }
      }
      return list.length ? list : ['SIL'];
    }

    async function toggleCamera() {
      if (!stream) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
          });
          webcam.srcObject = stream;
          await webcam.play();
          camPlaceholder.style.display = 'none';
          camBtn.textContent = 'Close Camera';
          snapBtn.disabled = false;
        } catch (e) {
          alert("Couldn't open camera");
        }
      } else {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        webcam.srcObject = null;
        camPlaceholder.style.display = 'block';
        camBtn.textContent = 'Open Camera';
        snapBtn.disabled = true;
      }
    }

    function freezePortrait() {
      if (!webcam.videoWidth || webcam.videoWidth === 0) {
        alert("Camera is warming up, try in 1 sec 😭");
        return;
      }

      canvas.width = 400;
      canvas.height = Math.round((webcam.videoHeight / webcam.videoWidth) * 400);

      ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);

      rawCapturedImage = new Image();
      rawCapturedImage.onload = () => {
        webcam.style.display = 'none';
        canvas.style.display = 'block';
        sliderBox.style.display = 'flex';

        mouthSlider.max = canvas.height - 10;
        detectedMouthY = Math.round(canvas.height * 0.52);
        mouthSlider.value = detectedMouthY;
        
        redrawPreviewGuide();

        snapBtn.textContent = 'Retake Photo';
        snapBtn.onclick = () => location.reload();
        genBtn.disabled = false;
        statusMsg.textContent = "Adjust slider right over your lips!";
      };
      rawCapturedImage.src = canvas.toDataURL('image/jpeg', 0.95);

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    function updateSeam(val) {
      detectedMouthY = parseInt(val, 10);
      seamLabel.textContent = `y=${detectedMouthY}px`;
      redrawPreviewGuide();
    }

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickY = e.clientY - rect.top;
      const scaleY = canvas.height / rect.height;
      const targetY = Math.round(clickY * scaleY);

      if (targetY > 10 && targetY < canvas.height - 10) {
        mouthSlider.value = targetY;
        updateSeam(targetY);
      }
    });

    function redrawPreviewGuide() {
      if (!rawCapturedImage) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(rawCapturedImage, 0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(0, detectedMouthY);
      ctx.lineTo(canvas.width, detectedMouthY);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    async function executeSynthesis() {
      const text = scriptInput.value.trim();
      if (!text || !rawCapturedImage) return;

      genBtn.disabled = true;
      statusMsg.textContent = "Parsing pronunciation rules & rendering frames...";
      outPlaceholder.style.display = "block";
      outPlaceholder.textContent = "Synthesizing...";
      outVideo.style.display = "none";

      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      const audioDest = audioCtx.createMediaStreamDestination();
      const canvasStream = canvas.captureStream(30);

      const mergedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioDest.stream.getAudioTracks()
      ]);

      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')
        ? 'video/webm;codecs=vp8,opus'
        : 'video/webm';

      const recorder = new MediaRecorder(mergedStream, { mimeType });
      const chunks = [];

      recorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        audioCtx.close();
        const blob = new Blob(chunks, { type: 'video/webm' });
        outVideo.src = URL.createObjectURL(blob);
        outPlaceholder.style.display = "none";
        outVideo.style.display = "block";
        statusMsg.textContent = "Synthesized video with embedded audio ready!";
        genBtn.disabled = false;
        downloadBtn.disabled = false;
        outVideo.play();
      };

      recorder.start();

      // Convert prompt into sequence of phonemes using pronunciation rules
      const words = text.split(/\s+/).filter(Boolean);
      let phonemeQueue = [];

      words.forEach(w => {
        const phs = wordToPhonemes(w);
        phonemeQueue.push(...phs);
        phonemeQueue.push('SIL'); // gap between words
      });

      let currentMouthShift = 0;
      let animating = true;

      // Rule-based vocal tract audio node architecture
      function synthesizePhonemeList(idx) {
        if (idx >= phonemeQueue.length) {
          currentMouthShift = 0;
          animating = false;
          setTimeout(() => recorder.stop(), 400);
          return;
        }

        const phKey = phonemeQueue[idx];
        const data = PHONEME_DATA[phKey] || PHONEME_DATA['AH'];
        const duration = phKey === 'SIL' ? 0.08 : 0.12;

        if (phKey !== 'SIL') {
          // Acoustic glottal source (voice cords)
          const osc = audioCtx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(125, audioCtx.currentTime); // Pitch

          // Vocal tract resonant formants (F1, F2 bandpass filters)
          const f1 = audioCtx.createBiquadFilter();
          f1.type = 'bandpass';
          f1.frequency.setValueAtTime(data.f1, audioCtx.currentTime);
          f1.Q.setValueAtTime(5, audioCtx.currentTime);

          const f2 = audioCtx.createBiquadFilter();
          f2.type = 'bandpass';
          f2.frequency.setValueAtTime(data.f2, audioCtx.currentTime);
          f2.Q.setValueAtTime(7, audioCtx.currentTime);

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.02);
          gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + duration);

          osc.connect(f1);
          osc.connect(f2);
          f1.connect(gain);
          f2.connect(gain);

          // Route to both speaker and video stream recorder
          gain.connect(audioDest);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + duration);

          // Rule: Jaw drops proportional to F1 vowel open ratio
          currentMouthShift = Math.round(data.open * 13);
        } else {
          currentMouthShift = 0;
        }

        setTimeout(() => {
          synthesizePhonemeList(idx + 1);
        }, duration * 1000);
      }

      synthesizePhonemeList(0);

      // Render loop synchronizing jaw drop with current acoustic formant
      function renderLoop() {
        if (!animating && currentMouthShift <= 0) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw inner mouth cavity if mouth is open
        if (currentMouthShift > 0) {
          ctx.fillStyle = '#3a080e';
          ctx.fillRect(0, detectedMouthY, canvas.width, currentMouthShift);

          // Teeth line
          ctx.fillStyle = '#f1f5f9';
          ctx.fillRect(canvas.width * 0.38, detectedMouthY, canvas.width * 0.24, Math.min(3, currentMouthShift));
        }

        // 1. Upper face fixed
        ctx.drawImage(rawCapturedImage, 0, 0, canvas.width, detectedMouthY, 0, 0, canvas.width, detectedMouthY);

        // 2. Lower jaw displaced by acoustic opening value
        ctx.drawImage(
          rawCapturedImage, 
          0, detectedMouthY, canvas.width, canvas.height - detectedMouthY, 
          0, detectedMouthY + currentMouthShift, canvas.width, canvas.height - detectedMouthY
        );

        requestAnimationFrame(renderLoop);
      }

      renderLoop();
    }

    function downloadVid() {
      const a = document.createElement('a');
      a.href = outVideo.src;
      a.download = 'vofa-render.webm';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
