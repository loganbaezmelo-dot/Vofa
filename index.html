<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vofa AI | Rule-Based Image AI</title>
  <style>
    :root {
      --bg: #0b0d14;
      --card: #131722;
      --border: #23293d;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; overflow-x: hidden; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .brand { font-size: 1.2rem; font-weight: 800; }
    .brand span { color: var(--accent); }
    .badge { font-size: 0.7rem; padding: 4px 8px; background: #1e293b; border-radius: 999px; color: #38bdf8; }

    .hero { text-align: center; margin: 16px 0; }
    .hero h1 { font-size: 1.3rem; margin-bottom: 4px; color: #fff; }
    .hero p { font-size: 0.8rem; color: var(--muted); }

    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    h2 { font-size: 0.95rem; }

    .viewport {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    video, canvas { width: 100%; height: 100%; object-fit: cover; }
    #renderCanvas { display: none; }

    button {
      padding: 10px 12px;
      background: #1c2233;
      border: 1px solid var(--border);
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border: none; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    textarea {
      width: 100%;
      height: 60px;
      background: #090b11;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      padding: 8px;
      font-size: 0.85rem;
      resize: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">VOFA <span>AI</span></div>
    <div class="badge">Deterministic Rule-Based AI</div>
  </header>

  <div class="hero">
    <h1>You don't need AI for AI-generated videos!</h1>
    <p>Algorithmic computer vision & rule-based synthesis.</p>
  </div>

  <div class="panel">
    <h2>1. Biometric Alignment</h2>
    <div class="viewport">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="renderCanvas" width="400" height="400"></canvas>
    </div>

    <div style="display: flex; gap: 8px;">
      <button id="camBtn" onclick="initCam()" style="flex:1;">Open Camera</button>
      <button id="snapBtn" onclick="applyRuleEngine()" style="flex:1;" disabled>Scan Face Boundary</button>
    </div>

    <h2>2. Speech Script</h2>
    <textarea id="scriptText">Look at that! Clean rule-based video generation running straight in the browser.</textarea>

    <button class="primary" id="renderBtn" onclick="executeSynthesis()" disabled>
      ⚡ Synthesize Output Clip
    </button>
  </div>

  <div class="panel">
    <h2>3. Video Output</h2>
    <video id="resultPlayer" controls playsinline style="border-radius: 8px; display: none;"></video>
    <p id="statusMsg" style="font-size: 0.8rem; color: var(--muted); text-align: center;">Awaiting biometric snapshot...</p>
  </div>

  <script>
    let camStream = null;
    let capturedImage = null;
    let detectedMouthY = 250; // Dynamic rule coordinate

    const webcam = document.getElementById('webcam');
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const camBtn = document.getElementById('camBtn');
    const snapBtn = document.getElementById('snapBtn');
    const renderBtn = document.getElementById('renderBtn');
    const resultPlayer = document.getElementById('resultPlayer');
    const statusMsg = document.getElementById('statusMsg');

    async function initCam() {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      webcam.srcObject = camStream;
      snapBtn.disabled = false;
      camBtn.disabled = true;
    }

    // Rule-Based Image Processing Algorithm
    function applyRuleEngine() {
      canvas.width = 400;
      canvas.height = 400;
      ctx.drawImage(webcam, 0, 0, 400, 400);

      // Computer Vision Rule: Scan luminance across lower 40% to detect lip crease
      const imgData = ctx.getImageData(0, 0, 400, 400);
      const data = imgData.data;
      let minBrightness = 255;
      let targetY = 250;

      // Scan rows 210 to 310 along center column
      for (let y = 210; y < 310; y++) {
        let rowBrightness = 0;
        for (let x = 160; x < 240; x++) {
          const idx = (y * 400 + x) * 4;
          const r = data[idx], g = data[idx + 1], b = data[idx + 2];
          rowBrightness += (r * 0.299 + g * 0.587 + b * 0.114);
        }
        rowBrightness /= 80;

        // Darkest horizontal seam rule
        if (rowBrightness < minBrightness) {
          minBrightness = rowBrightness;
          targetY = y;
        }
      }

      detectedMouthY = targetY;
      capturedImage = new Image();
      capturedImage.src = canvas.toDataURL('image/png');

      camStream.getTracks().forEach(t => t.stop());
      webcam.style.display = 'none';
      canvas.style.display = 'block';

      snapBtn.textContent = `Seam Found: y=${detectedMouthY} ✓`;
      renderBtn.disabled = false;
      statusMsg.textContent = `Rule applied: Lip boundary isolated at y=${detectedMouthY}px`;
    }

    function executeSynthesis() {
      const text = document.getElementById('scriptText').value;
      if (!text || !capturedImage) return;

      renderBtn.disabled = true;
      statusMsg.textContent = "Executing rule-based audio-visual sync...";

      const utterance = new SpeechSynthesisUtterance(text);
      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        resultPlayer.src = URL.createObjectURL(blob);
        resultPlayer.style.display = 'block';
        statusMsg.textContent = "Render complete via client rule engine!";
        renderBtn.disabled = false;
      };

      recorder.start();
      window.speechSynthesis.speak(utterance);

      let frame = 0;
      let animating = true;

      utterance.onend = () => {
        animating = false;
        setTimeout(() => recorder.stop(), 400);
      };

      function renderLoop() {
        if (!animating) return;

        ctx.clearRect(0, 0, 400, 400);

        // Render stationary upper skull up to detected lip seam
        ctx.drawImage(capturedImage, 0, 0, 400, detectedMouthY, 0, 0, 400, detectedMouthY);

        // Rule-based harmonic displacement
        const mouthShift = Math.sin(frame * 0.45) > 0 ? Math.sin(frame * 0.45) * 12 : 0;

        // Render lower jaw translated along the rule vector
        ctx.drawImage(
          capturedImage, 
          0, detectedMouthY, 400, 400 - detectedMouthY, 
          0, detectedMouthY + mouthShift, 400, 400 - detectedMouthY
        );

        frame++;
        requestAnimationFrame(renderLoop);
      }

      renderLoop();
    }
  </script>
</body>
</html>
